<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입찰 및 정비사업 통합 모니터링 대시보드</title>
    <!-- Tailwind CSS & Lucide Icons CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        .gold-glow {
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.35);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- 상단 헤더 -->
    <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-600 rounded-lg">
                    <i data-lucide="building-2" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">스마트 입찰·정비사업 모니터링</h1>
                    <p class="text-xs text-slate-400">G2B 나라장터 & 민간 정비사업 실시간 대시보드</p>
                </div>
            </div>

            <!-- 우측 컨트롤 (새로고침 & 모드 스위치) -->
            <div class="flex items-center gap-3">
                <button onclick="refreshData()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg text-sm font-medium border border-slate-700 transition">
                    <i id="refresh-icon" data-lucide="refresh-cw" class="w-4 h-4"></i>
                    <span>새로고침</span>
                </button>

                <div class="bg-slate-800 p-1 rounded-lg border border-slate-700 flex items-center">
                    <button id="btn-user-mode" onclick="setRole('user')" class="px-3 py-1.5 rounded-md text-xs font-semibold bg-blue-600 text-white transition">
                        👤 사용자 모드
                    </button>
                    <button id="btn-admin-mode" onclick="setRole('admin')" class="px-3 py-1.5 rounded-md text-xs font-semibold text-slate-400 hover:text-white transition">
                        ⚙️ 관리자 모드
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-7xl mx-auto px-4 mt-6">

        <!-- 상태 알림 바 -->
        <div id="status-bar" class="hidden mb-4 p-3 bg-blue-50 border border-blue-200 text-blue-800 text-xs rounded-lg flex items-center justify-between">
            <span class="flex items-center gap-2">
                <i data-lucide="info" class="w-4 h-4 text-blue-600"></i>
                <span id="status-msg">최신 데이터를 불러왔습니다.</span>
            </span>
            <button onclick="document.getElementById('status-bar').classList.add('hidden')" class="text-blue-500 hover:text-blue-700">✕</button>
        </div>

        <!-- 탭 및 검색 바 -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <!-- 탭 메뉴 -->
                <div class="flex flex-wrap gap-2 w-full md:w-auto">
                    <button onclick="setTab('all')" id="tab-all" class="tab-btn px-4 py-2.5 rounded-lg text-sm font-bold bg-blue-600 text-white shadow-sm">
                        📋 전체공고현황
                    </button>
                    <button onclick="setTab('plan')" id="tab-plan" class="tab-btn px-4 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">
                        📌 발주계획
                    </button>
                    <button onclick="setTab('spec')" id="tab-spec" class="tab-btn px-4 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">
                        🔍 사전규격
                    </button>
                    <button onclick="setTab('bid')" id="tab-bid" class="tab-btn px-4 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">
                        🏛️ 본공고 / 정비사업
                    </button>
                </div>

                <!-- 검색창 -->
                <div class="relative w-full md:w-72">
                    <input type="text" id="search-input" oninput="render()" placeholder="공고명, 기관명 검색..." class="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                </div>
            </div>
        </div>

        <!-- 공고 컨테이너 영역 -->
        <div id="notice-container">
            <!-- JavaScript로 동적 생성 -->
        </div>

    </main>

    <!-- 댓글 & 첨부파일 모달 -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-5 bg-slate-900 text-white flex justify-between items-center">
                <div>
                    <span id="modal-category" class="text-xs px-2 py-0.5 bg-blue-600 text-white rounded font-medium">카테고리</span>
                    <h3 id="modal-title" class="text-base font-bold mt-1">공고 상세 검토</h3>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl font-bold">✕</button>
            </div>

            <div class="p-6 overflow-y-auto space-y-6 flex-1">
                <!-- 댓글 섹션 -->
                <div>
                    <h4 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
                        <i data-lucide="message-square" class="w-4 h-4 text-blue-600"></i> 팀원 의견 및 협업 메모
                    </h4>
                    <div id="modal-comments-list" class="space-y-2 mb-3">
                        <!-- 댓글 리스트 -->
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="comment-input" placeholder="검토 의견이나 메모를 남겨주세요..." class="flex-1 text-sm px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="addComment()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-lg font-medium">등록</button>
                    </div>
                </div>

                <hr class="border-slate-200">

                <!-- 내부 첨부파일 섹션 -->
                <div>
                    <h4 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
                        <i data-lucide="file-text" class="w-4 h-4 text-blue-600"></i> 관련 검토서 및 첨부파일
                    </h4>
                    <div id="modal-files-list" class="space-y-2 mb-3">
                        <!-- 파일 리스트 -->
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="file" id="file-input" class="text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                        <button onclick="uploadFile()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-2 rounded-lg font-medium">업로드</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 초기 샘플 데이터
        let notices = [
            {
                id: "NOT001",
                ntceKindNm: "발주계획",
                ntceNm: "2026년 스마트 도시재생사업 기본계획 수립 용역",
                organ: "서울특별시",
                demand: "도시계획과",
                price: "450,000,000 원",
                dateNotice: "2026-10-24",
                dateBrief: "-",
                dateLimit: "2026-11-15",
                dateOpen: "2026-11-16",
                chgRsn: "",
                isImportant: true,
                comments: ["사업 규모가 적절하여 참여 검토 필요", "제안서 작성 준비 시작합시다."],
                files: ["도시재생_사업계획서_요약.pdf"]
            },
            {
                id: "NOT002",
                ntceKindNm: "사전규격",
                ntceNm: "지능형 교통체계(ITS) 구축 사전규격 공개",
                organ: "한국도로공사",
                demand: "교통연구소",
                price: "1,200,000,000 원",
                dateNotice: "2026-10-25",
                dateBrief: "-",
                dateLimit: "2026-10-31",
                dateOpen: "-",
                chgRsn: "",
                isImportant: false,
                comments: [],
                files: []
            },
            {
                id: "NOT003",
                ntceKindNm: "정비사업",
                ntceNm: "(정비사업) 반포 주공아파트 재건축정비사업 시공사 선정 공고",
                organ: "반포주공재건축조합",
                demand: "조합사무실",
                price: "-",
                dateNotice: "2026-10-20",
                dateBrief: "2026-10-28 14:00 (조합강당)",
                dateLimit: "2026-11-20 17:00",
                dateOpen: "2026-11-20 18:00",
                chgRsn: "현장설명회 장소가 조합강당으로 수정되었습니다.",
                isImportant: true,
                comments: ["현장설명회 필수 참석 인원 배치 요망"],
                files: ["현장설명회_참석안내.docx"]
            },
            {
                id: "NOT004",
                ntceKindNm: "본공고",
                ntceNm: "2026년 공공 데이터베이스 고도화 사업 입찰공고",
                organ: "행정안전부",
                demand: "정보화담당관",
                price: "850,000,000 원",
                dateNotice: "2026-10-26",
                dateBrief: "-",
                dateLimit: "2026-11-10",
                dateOpen: "2026-11-10",
                chgRsn: "",
                isImportant: false,
                comments: [],
                files: []
            }
        ];

        let currentRole = 'user'; // 'user' | 'admin'
        let currentTab = 'all';   // 'all' | 'plan' | 'spec' | 'bid'
        let activeNoticeId = null;

        // 역할 변경
        function setRole(role) {
            currentRole = role;
            document.getElementById('btn-user-mode').className = role === 'user' ? 'px-3 py-1.5 rounded-md text-xs font-semibold bg-blue-600 text-white transition' : 'px-3 py-1.5 rounded-md text-xs font-semibold text-slate-400 hover:text-white transition';
            document.getElementById('btn-admin-mode').className = role === 'admin' ? 'px-3 py-1.5 rounded-md text-xs font-semibold bg-amber-600 text-white transition' : 'px-3 py-1.5 rounded-md text-xs font-semibold text-slate-400 hover:text-white transition';
            
            showStatus(role === 'admin' ? '⚙️ 관리자 모드로 전환되었습니다. (중요 지정 권한 부여)' : '👤 사용자 모드로 전환되었습니다.');
            render();
        }

        // 탭 변경
        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = 'tab-btn px-4 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100';
            });
            document.getElementById(`tab-${tab}`).className = 'tab-btn px-4 py-2.5 rounded-lg text-sm font-bold bg-blue-600 text-white shadow-sm';
            render();
        }

        // 중요 공고 토글 (관리자 기능)
        function toggleImportant(id, event) {
            event.stopPropagation();
            const notice = notices.find(n => n.id === id);
            if(notice) {
                notice.isImportant = !notice.isImportant;
                showStatus(`[${notice.ntceNm.substring(0, 15)}...] 공고가 ${notice.isImportant ? '중요 공고로 지정' : '해제'}되었습니다.`);
                render();
            }
        }

        // 새로고침 시뮬레이션
        function refreshData() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('animate-spin');
            showStatus('최신 공고 데이터를 수집 및 갱신하고 있습니다...');
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                showStatus('✅ 최신 공고 데이터 갱신이 완료되었습니다.');
                render();
            }, 800);
        }

        // 상태 메시지 출력
        function showStatus(msg) {
            const bar = document.getElementById('status-bar');
            document.getElementById('status-msg').innerText = msg;
            bar.classList.remove('hidden');
        }

        // 공고 카드리스트 렌더링
        function renderCard(item) {
            const isRedevelopment = item.ntceKindNm === '정비사업' || item.ntceNm.includes('정비사업');
            const isImportant = item.isImportant;

            return `
                <div class="bg-white rounded-xl p-5 border ${isImportant ? 'border-amber-400 bg-amber-50/20 gold-glow relative' : 'border-slate-200 hover:border-slate-300'} shadow-sm transition">
                    ${isImportant ? `
                        <div class="absolute -top-3 left-4 bg-amber-500 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full flex items-center gap-1 shadow-sm">
                            ★ 중요 공고
                        </div>
                    ` : ''}

                    <div class="flex justify-between items-start gap-3 mb-2 ${isImportant ? 'mt-1' : ''}">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-semibold px-2 py-0.5 rounded ${
                                item.ntceKindNm === '발주계획' ? 'bg-indigo-100 text-indigo-700' :
                                item.ntceKindNm === '사전규격' ? 'bg-purple-100 text-purple-700' : 'bg-emerald-100 text-emerald-700'
                            }">${item.ntceKindNm}</span>
                            <span class="text-xs text-slate-400 font-mono">${item.id}</span>
                        </div>

                        ${currentRole === 'admin' ? `
                            <button onclick="toggleImportant('${item.id}', event)" class="text-xs font-semibold px-2.5 py-1 rounded-md border ${isImportant ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-slate-100 border-slate-200 text-slate-600'} hover:bg-amber-200 transition flex items-center gap-1">
                                <i data-lucide="star" class="w-3.5 h-3.5 ${isImportant ? 'fill-amber-500 text-amber-500' : ''}"></i>
                                ${isImportant ? '중요 해제' : '중요 지정'}
                            </button>
                        ` : ''}
                    </div>

                    <h3 class="text-base font-bold text-slate-900 mb-3 hover:text-blue-600 cursor-pointer" onclick="openModal('${item.id}')">
                        ${item.ntceNm}
                    </h3>

                    <!-- 기관 및 금액 정보 -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs bg-slate-50 p-3 rounded-lg mb-3 border border-slate-100">
                        <div><span class="text-slate-400 block">발주/수요처</span><span class="font-semibold text-slate-700">${item.organ}</span></div>
                        ${!isRedevelopment ? `<div><span class="text-slate-400 block">추정용역비</span><span class="font-bold text-blue-600">${item.price}</span></div>` : '<div><span class="text-slate-400 block">구분</span><span class="font-bold text-amber-600">민간 정비사업</span></div>'}
                        <div><span class="text-slate-400 block">공고일/현설일</span><span class="font-medium text-slate-700">${item.dateBrief !== '-' ? item.dateBrief : item.dateNotice}</span></div>
                        <div><span class="text-slate-400 block">제출마감일</span><span class="font-semibold text-rose-600">${item.dateLimit}</span></div>
                    </div>

                    <!-- 변경 사유 경고 표시 -->
                    ${item.chgRsn ? `
                        <div class="mb-3 p-2.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg flex items-start gap-1.5">
                            <i data-lucide="alert-triangle" class="w-4 h-4 text-rose-500 shrink-0 mt-0.5"></i>
                            <div><strong class="font-bold">* 변경/취소 사유:</strong> ${item.chgRsn}</div>
                        </div>
                    ` : ''}

                    <!-- 하단 댓글 & 첨부 정보 버튼 -->
                    <div class="flex justify-between items-center text-xs text-slate-500 pt-2 border-t border-slate-100">
                        <div class="flex items-center gap-3">
                            <span class="flex items-center gap-1"><i data-lucide="message-square" class="w-3.5 h-3.5 text-slate-400"></i> 댓글 ${item.comments.length}</span>
                            <span class="flex items-center gap-1"><i data-lucide="paperclip" class="w-3.5 h-3.5 text-slate-400"></i> 파일 ${item.files.length}</span>
                        </div>
                        <button onclick="openModal('${item.id}')" class="text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-1">
                            💬 댓글 & 업무 첨부 ➔
                        </button>
                    </div>
                </div>
            `;
        }

        // 전체 화면 렌더링
        function render() {
            const container = document.getElementById('notice-container');
            const searchKeyword = document.getElementById('search-input').value.toLowerCase();

            // 필터링
            let filtered = notices.filter(n => {
                const matchSearch = n.ntceNm.toLowerCase().includes(searchKeyword) || n.organ.toLowerCase().includes(searchKeyword);
