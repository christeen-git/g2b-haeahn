name: G2B Public Notice Scheduler

on:
  repository_dispatch:
    types: [run-bot]  # cron-job.org에서 보내는 신호를 받는 핵심 설정!
  workflow_dispatch:  # 수동 실행 버튼도 유지

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: |
          python main.py
          # 👇 이 부분을 추가해 주세요!
      - name: Commit and Push notices.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add notices.json
          git diff --staged --quiet || git commit -m "Auto-update notices.json [skip ci]"
          git push
